name: Goethe Course Monitor

on:
  schedule:
    # প্রতি ৫ মিনিট পর পর অটোমেটিক চেক করবে (২৪/৭)
    - cron: '*/1 * * * *'
  workflow_dispatch: # আপনি চাইলে ম্যানুয়ালি বাটনে ক্লিক করেও রান করতে পারবেন

permissions:
  contents: write

jobs:
  check-courses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run course checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python checker.py

      - name: Save updated course state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add course_state.json || true
          git diff --staged --quiet || git commit -m "Update course state [skip ci]"
          git pull --rebase origin main || true
          git push
